<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="MINIGAMES — игры для одного или нескольких игроков. Без рекламы и на одном устройстве.">
<title>MINIGAMES — Играй без лишнего</title>
<style>
:root{--bg:#000;--fg:#f7f7f7;--muted:#aaa;--panel:#292929;--line:#242424}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
button,a{font:inherit}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:54px 22px 70px;text-align:center;position:relative}
.hero-inner{width:min(100%,650px);display:flex;flex-direction:column;align-items:center}
.logo{width:clamp(132px,28vw,210px);height:auto;display:block;opacity:0;transform:translateY(54px);animation:rise .9s cubic-bezier(.2,.75,.25,1) .12s forwards}
.brand{font-size:clamp(36px,8vw,62px);font-weight:800;letter-spacing:.045em;margin:24px 0 0;opacity:0;transform:translateY(34px);animation:rise .8s cubic-bezier(.2,.75,.25,1) .55s forwards}
.download{margin-top:54px;min-width:min(100%,310px);padding:20px 34px;border:1px solid #3c3c3c;border-radius:20px;background:#303030;color:#fff;text-decoration:none;font-size:clamp(19px,4vw,25px);font-weight:700;letter-spacing:.035em;display:inline-flex;align-items:center;justify-content:center;gap:13px;opacity:0;transform:translateY(34px);animation:rise .8s cubic-bezier(.2,.75,.25,1) .9s forwards;transition:background .2s,transform .2s,border-color .2s;box-shadow:0 12px 35px #0008}
.download:hover{background:#414141;border-color:#666;transform:translateY(-3px)}
.download:active{transform:scale(.97)}
.download svg{width:23px;height:23px;stroke:currentColor;stroke-width:2.3;fill:none}
.scroll-hint{position:absolute;bottom:22px;color:#777;font-size:12px;letter-spacing:.18em;text-transform:uppercase;animation:bob 1.8s ease-in-out infinite}
.section{width:min(100% - 40px,900px);margin:0 auto;padding:90px 0}
.section-title{margin:0 0 30px;text-align:center;font-size:clamp(25px,5vw,34px);font-weight:750;letter-spacing:.035em}
.description{text-align:center;max-width:740px;margin:0 auto;color:#e6e6e6;font-size:clamp(17px,3.5vw,21px);line-height:1.75}
.ps{margin-top:22px;color:#999;font-size:15px}
.gallery-section{padding-top:34px;padding-bottom:100px}
.gallery-wrap{position:relative;margin-top:35px}
.gallery{display:flex;gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px max(12px,calc((100% - 245px)/2)) 24px}
.gallery::-webkit-scrollbar{display:none}
.shot{flex:0 0 min(70vw,245px);scroll-snap-align:center;border:1px solid #292929;border-radius:17px;background:#090909;padding:0;overflow:hidden;cursor:zoom-in;transition:transform .25s,border-color .25s,box-shadow .25s;box-shadow:0 12px 30px #0009}
.shot:hover{transform:translateY(-5px);border-color:#555}
.shot img{width:100%;height:auto;display:block;aspect-ratio:9/16;object-fit:cover}
.gallery-controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px}
.arrow{width:44px;height:44px;border:1px solid #3a3a3a;border-radius:50%;background:#202020;color:#fff;font-size:23px;cursor:pointer;transition:background .2s,transform .2s}
.arrow:hover{background:#383838;transform:scale(1.06)}
.counter{color:#888;font-size:14px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;cursor:zoom-out}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{display:block;max-width:min(92vw,560px);max-height:88svh;width:auto;height:auto;object-fit:contain;border-radius:10px;transform:scale(.88);transition:transform .28s cubic-bezier(.2,.75,.25,1)}
.lightbox.open img{transform:scale(1)}
.close-hint{position:absolute;bottom:22px;color:#aaa;font-size:13px;letter-spacing:.04em}
footer{border-top:1px solid #1c1c1c;padding:25px 16px;text-align:center;color:#666;font-size:13px}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(min-width:760px){.hero{min-height:100vh}.download{margin-top:62px}.section{padding-top:110px;padding-bottom:110px}.gallery{gap:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
const gallery = document.getElementById('gallery');
const shots = [...document.querySelectorAll('.shot')];
const counter = document.getElementById('counter');
const lightbox = document.getElementById('lightbox');
const largeImage = document.getElementById('largeImage');
let activeIndex = 0;

function updateCounter() {
  const center = gallery.scrollLeft + gallery.clientWidth / 2;
  let nearest = 0, distance = Infinity;
  shots.forEach((item, index) => {
    const itemCenter = item.offsetLeft + item.offsetWidth / 2;
    const d = Math.abs(center - itemCenter);
    if (d < distance) { distance = d; nearest = index; }
  });
  activeIndex = nearest;
  counter.textContent = `${activeIndex + 1} / ${shots.length}`;
}
gallery.addEventListener('scroll', () => requestAnimationFrame(updateCounter), {passive:true});
document.getElementById('prev').addEventListener('click', () => {
  shots[Math.max(0, activeIndex - 1)].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
});
document.getElementById('next').addEventListener('click', () => {
  shots[Math.min(shots.length - 1, activeIndex + 1)].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
});
shots.forEach((button) => button.addEventListener('click', () => {
  const img = button.querySelector('img');
  largeImage.src = img.src;
  largeImage.alt = img.alt;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}));
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeLightbox();
  if (lightbox.classList.contains('open')) return;
  if (event.key === 'ArrowRight') document.getElementById('next').click();
  if (event.key === 'ArrowLeft') document.getElementById('prev').click();
});
window.addEventListener('load', updateCounter);
</script>
</body>
</html>
